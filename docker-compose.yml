services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5436:5432"
    environment:
      POSTGRES_USER: critter_user
      POSTGRES_PASSWORD: critter_password
      POSTGRES_DB: critter_forum
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
